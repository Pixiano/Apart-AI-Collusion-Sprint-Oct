version = 1

; Model presets for llama-server router mode (one entry = one selectable model).
; Models are loaded on demand when a request names them, e.g. "model": "qwen3-14b".
; Paths point at the LM Studio model folder, nothing is copied.

[*]
n-gpu-layers = 99
; ctx-size is the TOTAL context, split across parallel slots (16384 / 4 slots was the old 4k per chat).
; Playground = 1 slot, so the whole ctx-size is yours. Edit here, restart serve.ps1. Real mode overrides these on the command line.
parallel = 1
ctx-size = 32768

[qwen3-8b]
model = %USERPROFILE%\.lmstudio\models\lmstudio-community\Qwen3-8B-GGUF\Qwen3-8B-Q4_K_M.gguf

[qwen3-14b]
model = %USERPROFILE%\.lmstudio\models\lmstudio-community\Qwen3-14B-GGUF\Qwen3-14B-Q4_K_M.gguf

[gemma4-12b]
model = %USERPROFILE%\.lmstudio\models\lmstudio-community\gemma-4-12B-it-QAT-GGUF\gemma-4-12B-it-QAT-Q4_0.gguf

[gpt-oss-20b]
model = %USERPROFILE%\.lmstudio\models\lmstudio-community\gpt-oss-20b-GGUF\gpt-oss-20b.gguf

[qwen3.5-4b]
model = %USERPROFILE%\.lmstudio\models\unsloth\Qwen3.5-4B-GGUF\Qwen3.5-4B-Q6_K.gguf

[minicpm5-2b]
model = %USERPROFILE%\.lmstudio\models\openbmb\MiniCPM5-2B-GGUF\MiniCPM5-2B-Q4_K_M.gguf

; very low quant (Q1), quality is poor, here only to try it
[bonsai-27b]
model = %USERPROFILE%\.lmstudio\models\lmstudio-community\Bonsai-27B-GGUF\Bonsai-27B-Q1_0.gguf

